---
layout: null
---
{% include base_path %}
{% capture _scroll_root %}{{ base_path }}/full/{% endcapture %}
{% assign _target = page.redirect_base | default: _scroll_root %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0;url={{ _target }}#{{ page.redirect_anchor }}">
  <script>window.location.replace("{{ _target }}#{{ page.redirect_anchor }}");</script>
  <link rel="canonical" href="{{ _target }}#{{ page.redirect_anchor }}">
</head>
<body>
  <p>Redirecting to <a href="{{ _target }}#{{ page.redirect_anchor }}">full site</a>…</p>
</body>
</html>
