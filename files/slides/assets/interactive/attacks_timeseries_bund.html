  <script>
    function fitPlotToFrame() {
      const embed = new URLSearchParams(window.location.search).get('embed') === '1';
      if (!embed) return;
      document.body.classList.add('embed');
      const wrap = document.querySelector('.plot-wrap');
      const svg = wrap && wrap.querySelector('svg');
      if (!wrap || !svg) return;

      svg.removeAttribute('width');
      svg.removeAttribute('height');

      const box = svg.viewBox && svg.viewBox.baseVal;
      const natW = box && box.width ? box.width : svg.getBBox().width;
      const natH = box && box.height ? box.height : svg.getBBox().height;
      if (!natW || !natH) return;

      const maxW = wrap.clientWidth;
      const maxH = document.documentElement.clientHeight;
      const scale = Math.min(maxW / natW, maxH / natH);
      svg.style.width = `${natW * scale}px`;
      svg.style.height = `${natH * scale}px`;
    }

    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.body.classList.add('embed');
      fitPlotToFrame();
      window.addEventListener('load', fitPlotToFrame);
      window.addEventListener('resize', fitPlotToFrame);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(fitPlotToFrame).observe(document.documentElement);
      }
    }
  </script>
