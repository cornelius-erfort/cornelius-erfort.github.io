# Manual fallback for refreshing _data/citations.json from Google Scholar.
#
# The scheduled refresh runs on the polsci server (cron, Mondays 06:15 CET),
# which scrapes from a university IP and pushes via a repo-scoped deploy key —
# see ~/scholar-updater/ on polsci and scripts/README.md.
#
# GitHub runners are usually CAPTCHA-blocked by Scholar, so this workflow
# exists only as a manual fallback and will often fail. It merges with the
# previous file when citing-paper lists are truncated and fails without
# committing when the profile cannot be loaded.

name: Update Scholar citations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scholar.txt
          python -m playwright install --with-deps chromium

      - name: Scrape Google Scholar
        id: scrape
        run: |
          set -euo pipefail
          python scripts/update_scholar_citations.py --headless --delay 2.5
        continue-on-error: true

      - name: Fail clearly if scrape failed
        if: steps.scrape.outcome != 'success'
        run: |
          echo "::warning::Scholar scrape failed (CAPTCHA / block / timeout). No commit will be made."
          exit 1

      - name: Commit and push if citations.json changed
        run: |
          set -euo pipefail
          if git diff --quiet -- _data/citations.json; then
            echo "No changes to _data/citations.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git commit -m "chore: refresh Google Scholar citation data"
          git push
